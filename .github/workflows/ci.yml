name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-format:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dusk-till-dawn
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.403
      - name: Restore
        run: dotnet restore DuskTillDawn.sln
      - name: Build
        run: dotnet build DuskTillDawn.sln --no-restore
      - name: Check formatting
        run: dotnet format DuskTillDawn.sln --no-restore --verify-no-changes
