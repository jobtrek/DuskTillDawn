name: Bug Report
description: Report a new bug.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Also tell us, what did you expect to happen?
      placeholder: Tell us what you see!
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: From launching the game to seeing the bug.
      placeholder: |
        1. Start a new night
        2. Walk to the server room
        3. ...
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: What OS are you seeing the problem on?
      multiple: true
      options:
        - Windows
        - macOS
        - Linux
  - type: dropdown
    id: run-mode
    attributes:
      label: How did you run the game?
      options:
        - Godot editor
        - Exported build
  - type: input
    id: commit
    attributes:
      label: Branch or commit
      description: Output of `git rev-parse --short HEAD`, or the build version.
  - type: textarea
    id: logs
    attributes:
      label: Relevant log or console error output
      description: Paste the Godot Output / Debugger errors. This will be automatically formatted into code, so no need for backticks.
      render: shell
