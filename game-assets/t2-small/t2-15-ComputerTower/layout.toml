[build]
metallic = ["metal_dark"]

["rubber feet"]
repeat = { x = 2, pitch_x = 16.41, y = 2, pitch_y = 37.5 }

["case shell"]
on = "rubber feet.top"
offset_y = 0.78

["dark seam lines"]
on = "case shell.top"
gap = -23.44
align = "left"

["dark seam lines 2"]
on = "case shell.top"
gap = -23.44
align = "right"

["front panel"]
on = "case shell.front"

["5 25 inch drive"]
on = "case shell.front"
offset_z = 14.84

["5 25 inch drive 2"]
on = "case shell.front"
offset_z = 10.16

["5 25 inch drive 3"]
on = "case shell.front"
offset_z = 14.84

["5 25 inch drive 4"]
on = "case shell.front"
offset_z = 10.16

["power button and leds"]
on = "case shell.front"
offset_z = 18.75

["power button and leds 2"]
on = "case shell.front"
offset_x = 3.91
offset_z = 18.75

["power button and leds 3"]
on = "case shell.front"
offset_x = 6.25
offset_z = 18.75

["usb ports"]
on = "case shell.front"
offset_x = -3.12
offset_z = 4.69
repeat = { x = 2, pitch_x = 3.91 }

["mesh vent slots across"]
on = "case shell.front"
offset_z = -10.94
repeat = { z = 7, pitch_z = 2.34 }

["rear power supply"]
on = "case shell.top"
gap = -10.94
y = "flush-back"
offset_x = -4.69

["rear power supply 2"]
on = "case shell.top"
gap = -8.59
y = "flush-back"
offset_x = -4.69
repeat = { z = 4, pitch_z = 2.34 }

["rear power supply 3"]
on = "case shell.top"
gap = -7.03
y = "flush-back"
offset_x = 4.69

["rear expansion slots"]
on = "case shell.top"
gap = -39.06
y = "flush-back"
offset_x = 4.69
repeat = { z = 5, pitch_z = 3.12 }
