# Server1U layout (base state: On). Spec chassis 45 cm includes the ears, so the body is narrower.
[chassis]
size = [42, 59, 4.4]

[bezel]
on = "chassis.front"

["rack ear left"]
on = "chassis.left"
y = "flush-front"

["rack ear right"]
on = "chassis.right"
y = "flush-front"

[vents]
on = "bezel.front"
size = [0.78, 0.78, 3]
gap = -0.78              # sunk into the bezel
align = "left"
offset_x = 2.3
repeat = { x = 8, pitch_x = 1.56 }

["drive bays"]
on = "bezel.front"
size = [4.7, 0.78, 3]
gap = -0.78
align = "left"
offset_x = 16.4
repeat = { x = 3, pitch_x = 5.5 }

["activity LED"]
on = "bezel.front"
size = [1.56, 0.78, 1.56]
gap = -0.78
align = ["left", "top"]
offset_x = 34.4
offset_z = -1.56

["status LED"]
on = "bezel.front"
size = [1.56, 0.78, 1.56]
gap = -0.78
align = ["left", "top"]
offset_x = 36.7
offset_z = -1.56

["power button"]
on = "bezel.front"
size = [1.56, 0.78, 1.56]
gap = -0.78
align = ["left", "bottom"]
offset_x = 39.1
offset_z = 0.78

[screws]
on = "bezel.front"
size = [0.78, 0.78, 0.78]
offset_y = 1.56          # lands on the front layer of the ears
repeat = { x = 2, pitch_x = 43.75, z = 2, pitch_z = 2.3 }

[label]
on = "chassis.top"
size = [8, 5, 0.78]
gap = -0.78
align = "left"
y = "flush-front"
offset_x = 5.5
offset_y = 12.5
