[build]
metallic = ["metal", "metal_dark", "trim"]

[feet]
repeat = { x = 2, pitch_x = 84.38, y = 2, pitch_y = 37.5 }

["cabinet body"]
on = "feet.top"
y = "flush-front"

["left door"]
on = "cabinet body.front"
