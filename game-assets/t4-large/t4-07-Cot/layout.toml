[legs]
repeat = { x = 2, pitch_x = 182.81, y = 2, pitch_y = 70.31 }

["side rails"]
on = "legs.top"
repeat = { y = 2, pitch_y = 76.56 }

["end rails"]
on = "legs.top"
align = "right"
repeat = { x = 2, pitch_x = 185.94 }

["cross slats"]
on = "legs.top"
offset_x = -4.69
repeat = { x = 10, pitch_x = 18.75 }

[mattress]
on = "side rails.top"

["stitched edge dots"]
on = "mattress.front"
offset_z = 1.56
repeat = { x = 15, pitch_x = 12.5 }

[pillow]
on = "mattress.top"
offset_x = -75

["pillow top ridge"]
on = "pillow.top"

[blanket]
on = "mattress.top"
align = "right"

["blanket folds"]
on = "blanket.top"
offset_x = -7.81
repeat = { x = 13, pitch_x = 9.38 }

["blanket folded edge near"]
on = "mattress.top"
offset_x = -56.25
