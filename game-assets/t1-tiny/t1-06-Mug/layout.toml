# Mug layout (base state: Full). Open-top shell body, frame rim, C-shaped handle.
[body]
shape = "hollow"
thickness = 0.78
open = ["top"]

["base ring"]
on = "body.bottom"

[rim]
on = "body.top"
size = [7.8, 7.8, 0.78]
shape = "hollow"
thickness = 0.78
open = ["top", "bottom"]

["coffee surface"]
on = "body.top"
size = [6.2, 6.2, 0.78]
offset_z = -2.3          # just below the rim

["logo label"]
on = "body.front"
size = [3, 0.78, 4]
gap = -0.78              # sunk into the front wall

[handle]
on = "body.right"
size = [3, 3.1, 5.5]      # chunkier than the Spec's 3 x 2 x 7 to match the old build
shape = "hollow"
thickness = 1.56
open = ["left", "front", "back"]

[[raw]]
# chip wear on the rim: carve one voxel
code = """
chip = Grid()
box(chip, 2, 2, 4, 4, 11, 11, 'plastic_white')
carve(V, chip)
"""
