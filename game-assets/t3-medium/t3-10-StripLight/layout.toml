[build]
metallic = ["metal", "trim"]

[palette]
diffuser_on = [1, 0.95, 0.7]
diffuser_off = [0.5, 0.5, 0.47]

["diffuser panel underneath"]

["metal housing channel above"]
on = "diffuser panel underneath.top"

["black end caps"]
on = "diffuser panel underneath.left"
align = "bottom"

["black end caps 2"]
on = "diffuser panel underneath.right"
align = "bottom"

["clip brackets"]
on = "metal housing channel above.top"
repeat = { x = 2, pitch_x = 78.12 }

["chain hangers"]
on = "clip brackets.top"
repeat = { x = 2, pitch_x = 78.91 }

["supply wire out"]
on = "metal housing channel above.top"
offset_x = 55.47

[states.Off]
"diffuser panel underneath" = { key = "diffuser_off" }
